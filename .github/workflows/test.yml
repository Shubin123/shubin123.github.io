name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          # The live check targets this account's deployment, so forks skip it.
          LIVE: ${{ github.repository_owner == 'Shubin123' && '1' || '' }}
